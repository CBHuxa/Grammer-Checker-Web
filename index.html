<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar and Spelling Checker</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1d2733;
    --muted: #5d6b7a;
    --line: #d9e0e8;
    --accent: #2456d6;
    --bad: #c2372b;
    --bad-bg: #fde8e6;
    --good: #1c7a45;
    --good-bg: #e4f5ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --card: #1b232c;
      --text: #e8edf2;
      --muted: #9aa8b6;
      --line: #2c3743;
      --accent: #7ba2ff;
      --bad: #ff8a80;
      --bad-bg: #3a1f1d;
      --good: #6fd39a;
      --good-bg: #16301f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  textarea {
    width: 100%;
    min-height: 140px;
    padding: 12px;
    font: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    resize: vertical;
  }
  textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 8px; margin: 12px 0 20px; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: wait; }
  .status { padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  .status.ok { background: var(--good-bg); color: var(--good); }
  .status.err { background: var(--bad-bg); color: var(--bad); }
  .issue {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--bad);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .issue .wrong { color: var(--bad); font-weight: 600; }
  .issue .fix { color: var(--good); font-weight: 600; }
  .issue p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  .corrected {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<main>
  <h1>Grammar and Spelling Checker</h1>
  <p class="sub">Type a statement, then press Check.</p>

  <label for="input" class="sub">Your text</label>
  <textarea id="input" placeholder="She go to school evry day."></textarea>

  <div class="row">
    <button class="primary" id="checkBtn">Check</button>
    <button id="clearBtn">Clear</button>
  </div>

  <div id="result" aria-live="polite"></div>
</main>

<script>
  const input = document.getElementById("input");
  const result = document.getElementById("result");
  const checkBtn = document.getElementById("checkBtn");
  const clearBtn = document.getElementById("clearBtn");

  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function check() {
    const text = input.value.trim();
    if (!text) {
      result.innerHTML = '<div class="status err">Type something first.</div>';
      return;
    }

    checkBtn.disabled = true;
    checkBtn.textContent = "Checking...";
    result.innerHTML = "";

    try {
      const res = await fetch("https://api.languagetool.org/v2/check", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ text, language: "en-US" })
      });
      if (!res.ok) throw new Error("Server error " + res.status);
      const data = await res.json();
      show(text, data.matches);
    } catch (e) {
      result.innerHTML = '<div class="status err">Could not reach the checker. Check your internet connection and try again.</div>';
    } finally {
      checkBtn.disabled = false;
      checkBtn.textContent = "Check";
    }
  }

  function show(text, matches) {
    if (!matches.length) {
      result.innerHTML = '<div class="status ok">No mistakes found ✅</div>';
      return;
    }

    let html = `<div class="status err">Found ${matches.length} issue(s)</div>`;
    let corrected = text;

    // Apply fixes from the end so earlier positions stay valid
    [...matches].sort((a, b) => b.offset - a.offset).forEach(m => {
      if (m.replacements.length) {
        corrected =
          corrected.slice(0, m.offset) +
          m.replacements[0].value +
          corrected.slice(m.offset + m.length);
      }
    });

    matches.forEach(m => {
      const wrong = text.substr(m.offset, m.length);
      const fix = m.replacements.length ? m.replacements[0].value : null;
      html += `<div class="issue">
        <span class="wrong">${esc(wrong)}</span>${fix ? ` → <span class="fix">${esc(fix)}</span>` : ""}
        <p>${esc(m.message)}</p>
      </div>`;
    });

    html += `<h2>Corrected text</h2><div class="corrected">${esc(corrected)}</div>
             <div class="row"><button id="copyBtn">Copy corrected text</button></div>`;
    result.innerHTML = html;

    document.getElementById("copyBtn").onclick = async e => {
      try {
        await navigator.clipboard.writeText(corrected);
        e.target.textContent = "Copied";
      } catch {
        e.target.textContent = "Copy failed";
      }
    };
  }

  checkBtn.addEventListener("click", check);
  clearBtn.addEventListener("click", () => { input.value = ""; result.innerHTML = ""; input.focus(); });
  input.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) check(); });
</script>
</body>
</html>
